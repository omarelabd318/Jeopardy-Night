<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeopardy Night: play</title>
<!-- 5.26: free-for-all. Each player scans the code on the TV once (/p?r=ROOM), joins with a name and keeps this page open;
     every clue's answer box appears here by itself. Talks to /api (worker/index.js). The player id stays in this browser, so a
     refresh keeps the same name and score. -->
<style>
:root{--bg:#050A5E;--panel:#0A1486;--line:#2B36B8;--fg:#fff;--muted:#AEB6FF;--gold:#FFCC33;--ink:#1C1606;--good:#3EE06A;--bad:#FF6B5E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.me{font-weight:800}
.score{font-weight:800;color:var(--gold);white-space:nowrap}
h1{margin:4px 0 12px;font-size:26px;line-height:1.15;color:var(--gold)}
.q{font-size:19px;font-weight:600;margin:4px 0 16px}
label{display:block;font-weight:700;margin:6px 0 8px}
input{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#111}
.unit{color:var(--muted);font-size:15px;margin-top:6px}
.go{width:100%;margin-top:16px;font:inherit;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:16px;border:0;border-radius:12px;background:var(--gold);color:var(--ink)}
.go:disabled{opacity:.5}
.msg{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.msg.ok{border-color:var(--good)} .msg.err{border-color:var(--bad)}
.hint{color:var(--muted);font-size:15px;margin-top:14px}
.wait{text-align:center;padding:40px 0 10px}
.wait .big{font-size:24px;font-weight:800;margin:10px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin:0 3px;animation:b 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
ol.ord{list-style:none;padding:0;margin:0;display:grid;gap:10px}
ol.ord li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
ol.ord .n{color:var(--gold);min-width:1.2em}
ol.ord .t{flex:1}
ol.ord .mv{display:flex;flex-direction:column;gap:6px}
ol.ord .mv button{font:inherit;font-size:16px;width:44px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg)}
ol.ord .mv button:disabled{opacity:.25}
</style></head><body><main>
<div class="top"><span class="me" id="me"></span><span class="score" id="score"></span></div>
<div id="view"></div>
</main>
<script>
const P = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const r = P.get("r") || "", KEY = "jn_ffa_" + r;
const esc = t => String(t ?? "").replace(/[&<>"]/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]));
let me = null; try{ me = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
let st = null, shown = "", order = null, timer = null, busy = false;
const post = (op, body) => fetch("api/" + op, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body)}).then(x => x.json().catch(() => ({})).then(j => ({ok: x.ok && j.ok, j})));
function newId(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for(let i=0;i<10;i++) s += a[Math.floor(Math.random()*a.length)]; return s; }
const ord = n => n + (["th","st","nd","rd"][(n%100>10&&n%100<14)||n%10>3?0:n%10]);

function joinView(err){
  $("me").textContent = ""; $("score").textContent = "";
  $("view").innerHTML = `<div class="eyebrow">Jeopardy Night · Free-for-all</div><h1>What's your name?</h1>
    <form id="jf" autocomplete="off"><input id="nm" maxlength="24" required enterkeyhint="go" value="${esc(me && me.n || "")}" placeholder="Your name">
    <button class="go" id="jb">Join</button></form>${err ? `<div class="msg err">${esc(err)}</div>` : ""}
    <p class="hint">You play on your own. Keep this page open: every clue's answer box pops up here.</p>`;
  $("nm").focus();
  $("jf").onsubmit = async e => { e.preventDefault(); const n = $("nm").value.trim(); if(!n) return; $("jb").disabled = true;
    const p = (me && me.p) || newId();
    try{ const res = await post("join", {r, p, n});
      if(res.ok){ me = {p, n}; try{ localStorage.setItem(KEY, JSON.stringify(me)); }catch(e){} shown = ""; loop(); return; }
      joinView(res.j.error === "full" ? "This game is full (30 players)." : "That didn't work. Try again."); }
    catch(e){ joinView("No connection. Check your internet and try again."); } };
}

function header(){
  $("me").textContent = me.n;
  $("score").textContent = st ? `${st.score} pts · ${ord(st.rank)} of ${st.n}` : "";
}

function draw(){
  header();
  const c = st && st.cur, key = c ? c.c + (st.closed ? ":x" : "") : "wait";
  if(key === shown) return;  // keep what the player is typing
  shown = key;
  if(!c){ $("view").innerHTML = `<div class="wait"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="big">You're in, ${esc(me.n)}!</div><div class="hint">Watch the TV. When a clue opens, your answer box appears here.</div></div>`; return; }
  const where = `<div class="eyebrow">${esc(c.cat)} · ${esc(c.val)}</div>`;
  if(st.closed){ $("view").innerHTML = `${where}<div class="wait"><div class="big">Answer revealed</div>
      <div class="hint">${st.mine ? `You said: <b>${esc(c.kind === "order" ? orderText(c, st.mine) : st.mine)}</b>. ` : "You didn't answer this one. "}Look at the TV to see if you got it.</div></div>`; return; }
  if(c.kind === "order"){
    order = st.mine ? st.mine.split(",").map(Number) : shuffle(c.ev.map((e,i) => i));
    $("view").innerHTML = `${where}<p class="q">${esc(c.q || "Put these in order, earliest first.")}</p><ol class="ord" id="ord"></ol>
      <button class="go" id="go">${st.mine ? "Update my order" : "Lock in this order"}</button><div class="msg ok" id="msg" ${st.mine ? "" : "hidden"}>Locked in. You can change it until the answer is revealed.</div>`;
    drawOrder(c);
    $("ord").onclick = e => { const b = e.target.closest("button[data-i]"); if(!b) return; const i = +b.dataset.i, j = i + +b.dataset.d;
      [order[i], order[j]] = [order[j], order[i]]; drawOrder(c); };
    $("go").onclick = () => send(c, order.join(","));
    return;
  }
  const num = c.kind === "num";
  $("view").innerHTML = `${where}<p class="q">${esc(c.q || "")}</p>
    <form id="f" autocomplete="off"><label for="v">${num ? "Your number" : "Your answer"}</label>
    <input id="v" ${num ? 'inputmode="decimal"' : 'autocapitalize="words"'} enterkeyhint="send" maxlength="120" value="${esc(st.mine || "")}">
    ${num && c.u ? `<div class="unit">In ${esc(c.u)}</div>` : ""}
    <button class="go" id="go">${st.mine ? "Change my answer" : "Lock in"}</button></form>
    <div class="msg ok" id="msg" ${st.mine ? "" : "hidden"}>Locked in: ${esc(st.mine || "")}. You can change it until the answer is revealed.</div>`;
  $("f").onsubmit = e => { e.preventDefault(); let v = $("v").value.trim(); if(!v) return;
    if(num){ const n = parseFloat(v.replace(/[, ]/g, "")); if(isNaN(n)){ say("Type a number.", "err"); return; } v = String(n); }
    $("v").blur(); send(c, v); };
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function orderText(c, v){ return v.split(",").map(i => c.ev[+i]).filter(Boolean).join(" → "); }
function drawOrder(c){ $("ord").innerHTML = order.map((k,i) => `<li><span class="n">${i+1}</span><span class="t">${esc(c.ev[k])}</span>
  <span class="mv"><button type="button" data-i="${i}" data-d="-1" ${i ? "" : "disabled"} aria-label="Move up">▲</button><button type="button" data-i="${i}" data-d="1" ${i < order.length-1 ? "" : "disabled"} aria-label="Move down">▼</button></span></li>`).join(""); }
function say(text, cls){ const m = $("msg"); if(!m) return; m.hidden = false; m.className = "msg " + (cls || ""); m.textContent = text; }
async function send(c, v){
  const b = $("go"); if(b) b.disabled = true;
  try{ const res = await post("answer", {r, c: c.c, t: me.p, v, k: "ffa"});
    if(res.ok){ st.mine = v; say(`Locked in: ${c.kind === "order" ? orderText(c, v) : v}. You can change it until the answer is revealed.`, "ok"); if(b) b.textContent = c.kind === "order" ? "Update my order" : "Change my answer"; }
    else if(res.j.error === "closed") say("Too late: the answer has already been revealed.", "err");
    else say("That didn't go through. Try again.", "err"); }
  catch(e){ say("No connection. Check your internet and try again.", "err"); }
  if(b) b.disabled = false;
}

async function poll(){
  if(busy || document.hidden) return; busy = true;
  try{ const j = await (await fetch(`api/state?r=${encodeURIComponent(r)}&p=${encodeURIComponent(me.p)}`, {cache:"no-store"})).json();
    if(j && j.name === null){ busy = false; stop(); joinView(); return; }  // the game doesn't know this player (new game): join again
    if(j && "cur" in j){ st = j; draw(); } }
  catch(e){}
  busy = false;
}
function stop(){ if(timer){ clearInterval(timer); timer = null; } }
function loop(){ stop(); header(); poll(); timer = setInterval(poll, 2000); }
document.addEventListener("visibilitychange", () => { if(!document.hidden && me && timer) poll(); });

if(!r) $("view").innerHTML = `<div class="msg err">This link is missing its game code. Scan the code on the TV again.</div>`;
else if(me && me.p){ $("view").innerHTML = `<div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`; loop(); }
else joinView();
</script>
</body></html>
