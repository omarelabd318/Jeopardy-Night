<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeopardy Night answer</title>
<!-- 5.9: the page a team opens by scanning the QR code on a clue. It sends their answer to the game through /api (worker/index.js).
     URL (5.18): /a?r=ROOM&c=CLUE; the clue's details come from /api/meta (older links carried them as k=, n=, x=, u=, cat=, val=) -->
<style>
:root{--bg:#050A5E;--panel:#0A1486;--line:#2B36B8;--fg:#fff;--muted:#AEB6FF;--gold:#FFCC33;--ink:#1C1606;--good:#3EE06A;--bad:#FF6B5E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 16px;font-size:26px;line-height:1.15;color:var(--gold)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.teams button{font:inherit;font-weight:700;padding:14px 10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
.teams button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
label{display:block;font-weight:700;margin:6px 0 8px}
input{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#111}
.unit{color:var(--muted);font-size:15px;margin-top:6px}
.go{width:100%;margin-top:16px;font:inherit;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:16px;border:0;border-radius:12px;background:var(--gold);color:var(--ink)}
.go:disabled{opacity:.5}
.msg{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.msg.ok{border-color:var(--good)} .msg.err{border-color:var(--bad)}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
</style></head><body><main>
<div class="eyebrow" id="where"></div>
<h1 id="title">Your answer</h1>
<div class="eyebrow">Which team are you?</div>
<div class="teams" id="teams"></div>
<form id="f" autocomplete="off">
  <label for="v" id="lbl">Answer</label>
  <input id="v" required>
  <div class="unit" id="unit"></div>
  <button class="go" id="go" type="submit">Lock in</button>
</form>
<div class="msg" id="msg" hidden></div>
<p class="hint" id="hint"></p>
</main>
<script>
/* 5.18: the QR link only holds the room (r) and clue (c); the rest comes from /api/meta. Older long links (with n=, k=…) still work. */
const P = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const r = P.get("r") || "", c = P.get("c") || "";
let k = "num", names = [], x = -1, team = null;
const KEY = "jn_team_" + r;
function say(text, cls){ const m = $("msg"); m.hidden = false; m.className = "msg " + (cls || ""); m.textContent = text; }
const escH = t => String(t).replace(/[&<>]/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[s]));
function drawTeams(){ $("teams").innerHTML = names.map((n, i) => i === x ? "" : `<button type="button" data-t="${i}" aria-pressed="${i === team}">${escH(n)}</button>`).join(""); }
function setup(m){
  k = m.k === "steal" ? "steal" : "num"; names = Array.isArray(m.n) ? m.n : String(m.n || "Team A|Team B").split("|"); x = m.x != null && m.x !== "" ? +m.x : -1;
  try{ const t = +localStorage.getItem(KEY); if(localStorage.getItem(KEY) !== null && Number.isInteger(t) && t >= 0 && t < names.length && t !== x) team = t; }catch(e){}
  $("where").textContent = [m.cat, m.val].filter(Boolean).join(" · ");
  if(k === "steal"){
    $("title").textContent = "Steal for half points"; $("lbl").textContent = "Your answer"; $("v").setAttribute("enterkeyhint", "send");
    $("hint").textContent = `Only for teams that aren't playing this tile${x >= 0 && names[x] ? ` (${names[x]} is playing)` : ""}. If the playing team gets it wrong and you're right, you get half the points. One go per team: it can't be changed.`;
  } else {
    $("title").textContent = "Your guess"; $("lbl").textContent = "Your number";
    $("v").setAttribute("inputmode", "decimal"); $("v").setAttribute("enterkeyhint", "send");
    if(m.u) $("unit").textContent = "In " + m.u;
    $("hint").textContent = "Closest wins. Nobody sees your number until the answer is revealed. One go per team: it can't be changed.";
  }
  drawTeams(); $("f").hidden = false; $("msg").hidden = true;
}
$("teams").onclick = e => { const b = e.target.closest("[data-t]"); if(!b) return; team = +b.dataset.t; try{ localStorage.setItem(KEY, team); }catch(e){} drawTeams(); $("v").focus(); };
$("f").onsubmit = async e => {
  e.preventDefault();
  if(team === null){ say("Tap your team first.", "err"); return; }
  let v = $("v").value.trim(); if(!v) return;
  if(k === "num"){ const n = parseFloat(v.replace(/[, ]/g, "")); if(isNaN(n)){ say("Type a number.", "err"); return; } v = String(n); }
  $("go").disabled = true;
  try{
    const res = await fetch("api/answer", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({r, c, t: team, v, k})});
    const j = await res.json().catch(() => ({}));
    /* 5.27 (Omar): answers are final and hidden once sent */
    if((res.ok && j.ok) || j.error === "locked"){ $("f").hidden = true; $("teams").hidden = true; say(`✓ Locked in for ${names[team]}. Your answer is hidden until the reveal. Watch the TV.`, "ok"); return; }
    else if(j.error === "closed") say("Too late: the answer has already been revealed.", "err");
    else say("That didn't go through. Try again.", "err");
  }catch(err){ say("No connection. Check your internet and try again.", "err"); }
  $("go").disabled = false;
};
(async () => {
  if(!r || !c){ say("This code is missing its game details. Scan the code on the TV again.", "err"); return; }
  if(P.has("n")){ setup({k:P.get("k"), n:P.get("n"), x:P.get("x"), u:P.get("u"), cat:P.get("cat"), val:P.get("val")}); return; }
  $("f").hidden = true; say("Loading…");
  for(let i = 0; i < 6; i++){
    try{ const j = await (await fetch(`api/meta?r=${encodeURIComponent(r)}&c=${encodeURIComponent(c)}`, {cache:"no-store"})).json(); if(j && j.m){ setup(j.m); return; } }catch(e){}
    await new Promise(res => setTimeout(res, 800));
  }
  say("Couldn't load this clue. Scan the code on the TV again.", "err");
})();
</script>
</body></html>
